[project]
name = "watchtower"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50",
    "typer>=0.12",
    "keyring>=25",
    "httpx>=0.27",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "mcp>=2.3,<3",
]

[project.scripts]
watchtower = "watchtower.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchtower"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
