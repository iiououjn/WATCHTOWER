[project]
name = "watchtower"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "click>=8",
    "httpx>=0.27",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "pyyaml>=6",
    "trafilatura>=2",
    "ddgs>=9",
    "bandit>=1.7",
]

[project.scripts]
watchtower = "watchtower.interface.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchtower"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# tests: F and E9 only; kits are star-imported (F403/F405) and pytest fixtures shadow imports (F811)
"tests/**" = ["B", "C901", "F403", "F405", "F811"]
