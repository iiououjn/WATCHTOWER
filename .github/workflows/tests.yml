name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest  # Docker and Ollama are faked in tests; no test needs macOS
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked  # uv reads .python-version (3.12); --locked fails on lock drift
      - run: uv run ruff check src tests
      - run: uv run pytest -q
